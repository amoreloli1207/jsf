<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
  "http://www.w3.org/TR/html4/frameset.dtd">
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>javaroot</title>
  <script type="text/javascript">
      function beforeUnload() {
        console.log("beforeUnload");
      }  
      function loadfinish() {
        console.log("loadfinish");
      }
  </script>
</head>
  <frameset name="fs2" cols="100%,*" border="0" onmousewheel="">
    <frameset name="fs" rows="*,*,*" border="0" OnBeforeUnload="beforeUnload();" onLoad="loadfinish();" onmousewheel="">
      <frame name="loadframe" src="loadframe.html" frameborder="0" tabindex="-1"/>
      <frame name="cntlframe" src="javaframe.html" frameborder="0" tabindex="-1"/>
      <frame name="javaframe" src="business.html" scrolling="auto" frameborder="0"/>
    </frameset>
    <!--余白領域画面設定有りの場合-->
    <frame name="javaframe3" frameborder="0"/>
  </frameset>
</html>
