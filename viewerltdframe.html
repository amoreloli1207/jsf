<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
  "http://www.w3.org/TR/html4/frameset.dtd">
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>viewerltdframe</title>
</head>
<!-- 嵌套 frameset：三个 frame 上下排布。比例可自行调整，换左右把 rows 改为 cols。 -->
<frameset rows="34%,33%,33%">
  <frame name="GAMNLTDF" title="GAMNLTDF" src="GAMNLTDF.html">
  <frame name="GAMNAPIF" title="GAMNAPIF" src="GAMNAPIF.html">
  <frame name="extF" title="extF" src="extF.html">
  <noframes>
    <body>
      <p>当前浏览器不支持 frameset。</p>
    </body>
  </noframes>
</frameset>
</html>
